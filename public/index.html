<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テロップメーカー</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23ffb020'/><rect x='12' y='38' width='40' height='10' rx='3' fill='%23171a21'/><rect x='18' y='16' width='28' height='14' rx='3' fill='%23171a21' opacity='.35'/></svg>">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeButton" type="button" title="最初の画面へ">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">テロップメーカー</span>
    </button>
    <div class="topbar-center" id="titleWrap" hidden>
      <input id="projectTitle" class="title-input" spellcheck="false" aria-label="プロジェクト名">
      <span id="saveState" class="save-state"></span>
    </div>
    <div class="topbar-right">
      <button class="btn ghost small" id="openExportsTop" type="button">書き出したファイル</button>
    </div>
  </header>

  <!-- 最初の画面 -->
  <main id="homeView" class="home" hidden>
    <div id="setupWarning" class="setup-warning" hidden></div>
    <section id="dropzone" class="dropzone" tabindex="0">
      <input type="file" id="fileInput" accept="video/*,.mov,.mp4,.m4v,.mts,.m2ts,.avi,.mkv,.webm" multiple hidden>
      <div class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="56" height="56"><rect x="6" y="12" width="52" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><rect x="14" y="38" width="36" height="7" rx="2" fill="currentColor"/><path d="M27 22v10l9-5z" fill="currentColor"/></svg>
      </div>
      <h1>動画をここにドラッグ＆ドロップ</h1>
      <p>話している言葉を、この Mac の中だけで文字起こししてテロップにします。動画がインターネットに送られることはありません。</p>
      <button class="btn primary" id="pickButton" type="button">動画を選ぶ</button>
    </section>
    <section id="uploads" class="uploads"></section>
    <section class="projects">
      <div class="section-head">
        <h2>これまでのテロップ</h2>
        <div class="section-actions">
          <button class="btn ghost small" id="dictButton" type="button">言葉の置き換え辞書</button>
        </div>
      </div>
      <div id="projectGrid" class="project-grid"></div>
      <p id="projectsEmpty" class="empty" hidden>まだありません。上の枠に動画をドラッグしてください。</p>
    </section>
  </main>

  <!-- 編集画面 -->
  <main id="editorView" class="editor" hidden>
    <section class="stage-column">
      <div id="stage" class="stage">
        <div id="stageBox" class="stage-box">
          <video id="video" playsinline preload="auto"></video>
          <canvas id="overlay" class="overlay"></canvas>
        </div>
        <div id="processing" class="processing" hidden></div>
      </div>
      <div class="transport">
        <button class="icon-btn" id="playButton" type="button" title="再生 / 一時停止（スペース）" aria-label="再生">
          <svg class="icon-play" viewBox="0 0 24 24" width="20" height="20"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="20" height="20"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <span id="timeLabel" class="time-label">0:00.0 / 0:00.0</span>
        <select id="rateSelect" class="select small" title="再生速度">
          <option value="0.5">0.5倍</option>
          <option value="0.75">0.75倍</option>
          <option value="1" selected>1倍</option>
          <option value="1.25">1.25倍</option>
          <option value="1.5">1.5倍</option>
          <option value="2">2倍</option>
        </select>
        <div class="spacer"></div>
        <button class="btn ghost small" id="frameCheckButton" type="button" title="いまの場面を、書き出しと同じ仕組みで描いて確認します">仕上がりを確認</button>
      </div>
      <div class="timeline-wrap">
        <div class="timeline-head">
          <span class="hint">波形の上をクリックで移動、帯の端をドラッグで表示時間を調整、ダブルクリックで追加</span>
          <label class="zoom">拡大
            <input type="range" id="zoomRange" min="0" max="100" value="30">
          </label>
        </div>
        <div id="timelineScroll" class="timeline-scroll">
          <div id="timelineSpacer" class="timeline-spacer"></div>
          <canvas id="timeline" class="timeline"></canvas>
        </div>
      </div>
    </section>

    <aside class="side">
      <nav class="tabs" role="tablist">
        <button role="tab" type="button" data-tab="captions" class="active">テロップ</button>
        <button role="tab" type="button" data-tab="design">デザイン</button>
        <button role="tab" type="button" data-tab="export">書き出し</button>
      </nav>

      <div class="tab-panel" id="tab-captions">
        <div class="list-toolbar">
          <button class="btn small" id="addCaption" type="button" title="再生位置にテロップを追加">＋ 追加</button>
          <button class="btn ghost small" id="undoButton" type="button" title="元に戻す（⌘Z）">元に戻す</button>
          <button class="btn ghost small" id="redoButton" type="button" title="やり直す（⇧⌘Z）">やり直す</button>
          <button class="btn ghost small" id="replaceButton" type="button" title="まとめて置き換え（⌘F）">置換</button>
          <div class="spacer"></div>
          <button class="btn ghost small" id="retranscribeButton" type="button">文字起こしをやり直す</button>
        </div>
        <div id="notice" class="notice" hidden></div>
        <div id="captionList" class="caption-list"></div>
      </div>

      <div class="tab-panel" id="tab-design" hidden></div>
      <div class="tab-panel" id="tab-export" hidden></div>
    </aside>
  </main>

  <dialog id="replaceDialog" class="dialog">
    <form method="dialog" class="dialog-body" id="replaceForm">
      <h3>まとめて置き換え</h3>
      <label class="field">探す言葉<input id="findInput" required autocomplete="off"></label>
      <label class="field">置き換える言葉<input id="replaceInput" autocomplete="off"></label>
      <label class="check"><input type="checkbox" id="rememberReplace"> 辞書に登録して、次からの文字起こしでも自動で直す</label>
      <p class="dialog-note" id="replaceCount"></p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" type="submit" formnovalidate>閉じる</button>
        <button class="btn primary" value="replace" type="submit" id="replaceSubmit">すべて置き換える</button>
      </div>
    </form>
  </dialog>

  <dialog id="dictDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3>言葉の置き換え辞書</h3>
      <p class="dialog-note">文字起こしのたびに自動で直す言葉です（例: よく聞き間違える名前）。</p>
      <div id="dictRows" class="dict-rows"></div>
      <button class="btn ghost small" id="dictAdd" type="button">＋ 行を追加</button>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" type="submit">閉じる</button>
        <button class="btn primary" value="save" type="submit" id="dictSave">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="frameDialog" class="dialog wide">
    <div class="dialog-body">
      <h3>仕上がりの確認</h3>
      <p class="dialog-note">書き出しと同じ仕組みで、いまの場面を1コマだけ描きました。</p>
      <div class="frame-box"><img id="frameImage" alt="書き出しイメージ"></div>
      <div class="dialog-actions">
        <button class="btn primary" type="button" id="frameClose">閉じる</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
